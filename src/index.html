<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Robert Adrian King</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("unknown.png");
        background-size: cover;
        background-position: center;
        z-index: -1;
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: -1;
      }

      #text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 4rem;
        text-shadow: 2px 2px 4px #000;
        z-index: 1;
      }

      #text:hover {
        text-shadow: 4px 4px 8px #000;
      }
    </style>
  </head>
  <body>
    <div id="fullscreen"></div>
    <div id="overlay"></div>
    <h1 id="text">Joe's Hole Banner</h1>
  </body>
</html>
