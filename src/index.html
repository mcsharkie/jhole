<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Robert Adrian King</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .fullscreen {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
      }

      .fullscreen__image {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .fullscreen__item {
        position: relative;
        width: 100vw;
        height: 100vh;
        flex-shrink: 0;
        scroll-snap-align: start;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .fullscreen__item img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        transform: scale(1);
        transition: transform 0.5s ease-in-out;
      }

      .fullscreen__item:hover img {
        transform: scale(1.1);
      }

      .fullscreen__text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 4rem;
        text-shadow: 2px 2px 4px #000;
        z-index: 1;
      }

      .fullscreen__text:hover {
        text-shadow: 4px 4px 8px #000;
      }

      /* Add a gradient overlay to the images */
      .fullscreen__item::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.1));
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="fullscreen">
      <div class="fullscreen__item">
        <img class="fullscreen__image" src="unknown.png" alt="Image 1">
        <h1 class="fullscreen__text">JO HOL</h1>
      </div>
      <div class="fullscreen__item">
        <img class="fullscreen__image" src="cachedImage.PNG" alt="Image 2">
        <h1 class="fullscreen__text">ROBAH</h1>
      </div>
      <div class="fullscreen__item">
        <img class="fullscreen__image" src="318451189_466994682247883_7575363999365832789_n.jpg" alt="Image 3">
        <h1 class="fullscreen__text">HEEEHEEEHEEE</h1>
      </div>
      <div class="fullscreen__item">
        <img class="fullscreen__image" src="84592f5fd51c977162094e88a9ab9dbc.jpg" alt="Image 4">
        <h1 class="fullscreen__text">metode of transportation</h1>
      </div>
    </div>

    <script>
      const items = document.querySelectorAll('.fullscreen__item');

      let x = 0;

      document.addEventListener('wheel', (e) => {
        if (e.deltaY > 0) {
          x += 100;
          x = Math.min(x, items.length * window.innerWidth);
          items[0].style.transform = `translateX(${-x}px)`;
        } else {
          x -= 100;
          x = Math.max(x, 0);
          items[0].style.transform = `translateX(${-x}px)`;
        }
      });
    </script>
  </body>
</html>
